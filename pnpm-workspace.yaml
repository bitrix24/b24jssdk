packages:
  - docs
  - packages/jssdk
  - packages/jssdk-nuxt
  - playgrounds/nuxt
  - playgrounds/cli

# Single source of truth for dependencies declared in more than one manifest.
#
# `axios` is both a runtime dependency of `@bitrix24/b24jssdk` and a devDependency
# of the workspace root (the root is where the unit specs live, and several of
# them construct or match an `AxiosError`). Declared separately, the two ranges
# can drift — a bump to one manifest and not the other resolves two copies of
# axios, and `instanceof AxiosError` then fails across the boundary: the error the
# SDK throws is built from its copy and tested against the root's. Nothing catches
# that at install or type-check time; it surfaces as a test asserting on an error
# class that suddenly does not match.
#
# The catalog removes the second copy of the version rather than guarding it. Both
# manifests say `catalog:`, and this is the only place the range is written.
#
# NOTE: `catalog:` is a pnpm protocol — it is resolved to the concrete range when
# the package is packed, so the published manifest carries `^1.19.0`, not
# `catalog:`. That resolution is `pnpm publish`'s doing (which is what
# npm-publish-js-sdk.yml runs). Publishing this package with plain `npm publish`
# would ship the literal `catalog:` string and break every consumer's install.
catalog:
  axios: ^1.19.0

# Security/audit override pins for transitive dependencies. Each is a floor
# (`>=fixed-version`) held until the dependency tree resolves that version on its
# own. RETIREMENT (#175): when `pnpm why <pkg>` shows every path already resolves
# at or above the floor — i.e. the pin no longer changes resolution — drop the
# line, run `pnpm install`, and confirm `pnpm audit --audit-level=moderate`
# (the command CI runs — prod + dev deps, moderate threshold) stays clean.
# Re-evaluate on each dependency bump (the weekly Dependabot npm PR is a
# natural trigger).
#
# FLOORS GO STALE. A floor pins the version that was patched *at the time it was
# written*; a later advisory against the same package moves the patched version
# up and leaves the floor holding a now-vulnerable version. Nothing re-checks
# this on its own — CI runs `pnpm audit` only on pushes and pull requests, so the
# first symptom is an unrelated PR going red (that is how the five floors below
# were found lagging). When audit regresses, raise the floor to the version the
# advisory names rather than assuming the pin is still doing its job.
#
# UPPER BOUND: every *range* floor below also carries a `<next-major` ceiling (the
# dedupe pins at the end of the block are exact versions instead, so they need no
# ceiling). An override wins over the range every dependent declares, so an
# unbounded floor silently pulls a new major into the whole tree the moment one is
# published — `pnpm update` once moved `js-yaml` 4 → 5 (pure ESM, no default
# export: it broke `scripts/_docs-utils.mjs`) and `fast-uri` 3 → 4 (past the
# `^3.0.1` that `ajv` declares) in exactly this way. A major crossing must be a
# deliberate edit here, not a side effect of a bump — js-yaml 5 is on the floor
# below only because that edit was later made on purpose, with the named-import
# migration `scripts/_docs-utils.mjs` needed to go with it.
#
# LOWER BOUND: keep each floor at or above what the manifests declare. Because the
# override replaces the declared range AND is what pnpm records as the lockfile
# specifier, a floor that lags a manifest holds an older version that
# `pnpm install --frozen-lockfile` still accepts — there is no gate that catches
# it. That is what happened to `nuxt` here: the manifests moved to `^4.5.1` while
# this floor still read `>=4.4.7`, so the tree stayed on 4.4.8 and carried
# duplicate `@nuxt/kit` / `@nuxt/schema` trees.
overrides:
  # GHSA-7p8r-x3mc-p8w7 — fast-uri host confusion via backslash authority
  # introducer. Floor raised to 3.1.6 for the follow-up advisory on the same
  # parser; 3.1.5 no longer clears the audit.
  fast-uri: '>=3.1.6 <4'
  # GHSA-8j4g-w8fx-2239 — ReDoS in CORS middleware; GHSA-f23p-vx2j-j53r — `memo()`
  # retains SSR output across requests; GHSA-54fx-42gc-7vw4 — DoS in Language
  # middleware; GHSA-79qm-7rj5-m7r9 — Proxy Helper leaves `Connection`-listed
  # response headers in place. All four are fixed in 4.12.34.
  hono: '>=4.12.34 <5'
  ip-address: '>=10.1.1 <11'
  # GHSA-rgw5-rvv9-x895 — DoS via unbounded intermediate arrays (bypasses the
  # CVE-2026-14257 mitigation)
  brace-expansion: '>=5.0.9 <6'
  # …but v5 dropped the callable default export, and `minimatch` below v10 still
  # declares `^2.0.x` and calls it that way — under the tree-wide v5 above, every
  # brace pattern throws (`expand is not a function` on minimatch 5.x,
  # `brace_expansion_1.default is not a function` on 9.x; plain patterns are
  # unaffected, which is why nothing caught it). `minimatch@10` legitimately wants
  # v5, so the exemption is scoped by version. 2.1.4 is the patched 2.x line for
  # the same advisory chain, so this stays audit-clean.
  'minimatch@<10>brace-expansion': '>=2.1.4 <3'
  # GHSA-2v37-7h3g-55p8 — custom generators can loop indefinitely when size is zero.
  # The tree carries only the 3.x line, so the ceiling is that major.
  nanoid: '>=3.3.18 <4'
  ws: '>=8.20.1 <9'
  # Two advisories, and the later one has the higher floor: 6.15.4 patches the
  # first, 6.16.0 the second, so the override has to be the latter.
  qs: '>=6.16.0 <7'
  devalue: '>=5.8.1 <6'
  # esbuild is 0.x — every minor is a breaking release, so the ceiling is the minor
  esbuild: '>=0.28.1 <0.29'
  form-data: '>=4.0.6 <5'
  # GHSA-cp6q-959q-f8rh — mergeAttributes() turns an own `__proto__` key into
  # inherited executable DOM attributes. Reaches us only through the docs app
  # (`@bitrix24/b24ui-nuxt`), which is still a dev dependency that executes
  # during the docs build in CI.
  '@tiptap/core': '>=3.30.4 <4'
  # nuxt 4.5.1's `@nuxt/vite-builder` declares `vite: ^8.1.5` and imports
  # `transformWithOxc`, which only vite 8 exports — on vite 7 the builder fails to
  # load with `SyntaxError: The requested module 'vite' does not provide an export
  # named 'transformWithOxc'`. Note this only surfaces in `nuxt build`; `nuxt
  # typecheck` never loads the builder, so the typecheck gate cannot catch it.
  vite: '>=8.1.5 <9'
  # vite 8 pins rolldown ~1.1.5 while `unplugin` accepts any version, so pnpm
  # otherwise also installs 1.2.x and the two native ABIs collide inside one worker
  # process. Same pin as the sibling `bitrix24/b24ui` repo.
  rolldown: '~1.1.5'
  # Bump this floor in lockstep with the `nuxt` range in the four manifests — see
  # the LOWER BOUND note above for why a lagging floor is silent.
  nuxt: '>=4.5.2 <5'
  # Dedupe pins, not security floors. `nuxt` alone is not enough: `@nuxt/kit` and
  # `@nuxt/schema` are separate packages that the `nuxt` override does not reach, and
  # dependents declaring `^4.5.1` (`@bitrix24/b24ui-nuxt`, `@nuxt/content`, `@nuxt/image`,
  # `@nuxtjs/mdc`) otherwise keep a second 4.5.1 copy alive next to nuxt's own 4.5.2 —
  # two `Nuxt`/`NuxtConfig` types in one `nuxt typecheck`. Move all three in lockstep.
  '@nuxt/kit': '>=4.5.2 <5'
  '@nuxt/schema': '>=4.5.2 <5'
  # `nuxt-schema-org` imports `hasOwn` from `unhead/utils`, which only exists from
  # unhead 3.3.0 on. Without this floor the tree carries both 3.2.x and 3.3.x and
  # `nuxt-schema-org` resolves against the older copy, so `nuxt typecheck` dies at
  # module setup with `The requested module 'unhead/utils' does not provide an
  # export named 'hasOwn'`. Pinning the floor collapses the tree onto one copy.
  # The floor sits at 3.3.2 rather than the 3.3.0 that added `hasOwn` simply because
  # that is the current 3.x tip — there is no separate reason to require the patches.
  # `@unhead/vue` is a distinct package this does not reach, so it needs its own pin
  # below; without it the vue facade splits 3.2.x/3.3.x and can reintroduce the same
  # class of failure through a different import path.
  unhead: '>=3.3.2 <4'
  '@unhead/vue': '>=3.3.2 <4'
  # GHSA-vmf3-w455-68vh — tar parser interpretation differential (file smuggling)
  tar: '>=7.5.16 <8'
  # GHSA-v6wh-96g9-6wx3 — launch-editor NTLMv2 hash disclosure via UNC path (Windows)
  launch-editor: '>=2.14.1 <3'
  # GHSA-6v5v-wf23-fmfq — markdown-it quadratic-complexity DoS in smartquotes
  markdown-it: '>=14.1.2 <15'
  # GHSA-h67p-54hq-rp68 — js-yaml quadratic-complexity DoS in merge-key aliases;
  # GHSA-5p4m-2wfm-xmqj — quadratic CPU consumption in `!!omap` resolution
  # (CVE-2026-59870 fix not backported below 4.3.1; the 5.x line carries both
  # fixes, and 5 is what the root manifest now declares)
  js-yaml: '>=5.3.0 <6'
  # GHSA-f88m-g3jw-g9cj — sharp; reached via docs>@nuxt/image>ipx and
  # docs>nuxt-og-image. sharp is 0.x, so the ceiling is the minor.
  sharp: '>=0.35.3 <0.36'
  # Not security pins — a dedupe pin, mirroring the same block in the sibling
  # `bitrix24/b24ui` repo. `nuxt-og-image` / `nuxt-schema-org` pull `nuxtseo-shared`
  # → `@unhead/vue` → `@vitejs/devtools-kit` → `devframe`, which depends on the h3
  # v2 release candidate. h3 v2 in the tree makes `@nuxtjs/mcp-toolkit` resolve its
  # h3 *peer* to v2 while Nitro still hands docs' server routes an h3 v1 `H3Event` —
  # two structurally different `H3Event` types in one `nuxt typecheck`. A range
  # override does not settle a peer; an exact version does.
  # Drop once @nuxtjs/mcp-toolkit and Nitro agree on one h3 major.
  # SHARP EDGE: devframe's h3-touching modules (`utils/serve-static`, `node/index`)
  # import `H3` / `defineHandler` / `toNodeHandler`, which exist only in h3 v2 — under
  # this pin they throw `SyntaxError: The requested module 'h3' does not provide an
  # export named 'H3'` at ESM link time. Nothing reaches them today: the only importer
  # is `@vitejs/devtools-kit/node`, and nothing in this repo imports that subpath
  # (`@unhead/bundler` takes `defineRpcFunction` from the package root instead). If a
  # future devtools-kit / @unhead/bundler release starts using the `/node` subpath,
  # that link-time SyntaxError — not a resolution error — is what you will see.
  # EXEMPT FROM THE FLOOR MECHANISM: this is the one exact pin in the block, so unlike
  # the `>=fixed` security floors it cannot pick up an h3 1.15.x patch on its own. A
  # future h3 v1 advisory needs this line edited by hand — `pnpm audit` will report
  # the finding, but nothing signals that this entry is different in kind.
  h3: 1.15.11
  # Also a dedupe pin. `shiki-transformer-color-highlight@1.1.0` (latest) still asks
  # for `@shikijs/core`/`@shikijs/types` ^3, while docs, `@nuxtjs/mdc` and
  # `@nuxt/content` are on shiki 4 — so the transformer it returns is a nominally
  # different `ShikiTransformer` than the array in `docs/app/mdc.config.ts` accepts.
  # The transformer's whole runtime surface from `@shikijs/core` is `splitToken`, which
  # shiki 4 still exports unchanged — that one symbol is what to re-check on a bump.
  # Drop once the transformer package ships shiki 4 support.
  # Dedupe pin. `@nuxt/content` declares `@nuxtjs/mdc` `^0.22.2` while docs is on `^0.23.0`;
  # 0.23.x satisfies both, and without this the older copy stays and drags a second `shiki`
  # (4.3.1) in with it — which would then resolve against the 4.4.x core pinned below.
  '@nuxtjs/mdc': '>=0.23.0 <1'
  # Keep these three at or above the `@shikijs/*` range in `docs/package.json`. Because the
  # override replaces the declared range, a lagging floor silently pins docs BELOW what it
  # asks for. `shiki` needs the same treatment and for a sharper reason: each `shiki` release
  # depends on its own exact `@shikijs/core`/`@shikijs/types`, so pinning the two scoped
  # packages without `shiki` itself just moves the mismatch — a leftover `shiki@4.3.1`
  # (held by `@nuxt/content`, which asks for a satisfiable `^4.3.1`) would load a 4.4.x core
  # against its own 4.3.x engine and themes. All three move together or none do.
  shiki: '>=4.4.2 <5'
  '@shikijs/core': '>=4.4.2 <5'
  '@shikijs/types': '>=4.4.2 <5'
  # `@nuxt/content` also depends on `@shikijs/langs` directly (`^4.3.1`), so without this
  # a 4.3.1 grammar set lingers beside the 4.4.x core above. Same lockstep rule.
  '@shikijs/langs': '>=4.4.2 <5'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
