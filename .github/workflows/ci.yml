name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs for fast feedback, but never on main — a main
  # run may be mid GitHub Pages deploy, which must not be killed (#111).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Docs lint runs in its own job with full history because docs:lint-pages
  # reads `git log -1 -- <source>` and needs each linked source file's real
  # last-modification date. Kept separate from `build` so the rest of CI can
  # stay on a shallow checkout. The frontmatter parser (scripts/_docs-utils.mjs)
  # now depends on `js-yaml` (#63), so this job installs deps too — a frozen
  # install without dev:prepare, which is still far lighter than a full build.
  docs-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs pages
        run: node scripts/docs-lint.mjs --strict

      - name: Check docs internal links
        run: node scripts/docs-link-check.mjs

      - name: Check guide internal links (AGENTS.md + .github/contributing)
        run: node scripts/md-internal-links.mjs

      - name: Check the API Reference index covers every public export
        run: node scripts/check-api-reference-index.mjs

      - name: Test docs-lint scripts
        run: node --test "scripts/__tests__/**/*.test.mjs"

      - name: Check v3 action/method references (docs + skills)
        run: node scripts/check-v3-method-refs.mjs

      - name: Lint GitHub Actions workflows (actionlint)
        # Catches workflow mistakes (bad expressions, job/needs wiring, shell
        # issues via shellcheck on the runner) on every PR — the publish path in
        # the npm-publish-*.yml workflows has no other gate. Pinned release asset,
        # not a mutable tag.
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

  # Installs dependencies and runs dev:prepare once; the generated outputs
  # (packages/jssdk/dist, .nuxt type dirs) are uploaded as an artifact so
  # the parallel lint / typecheck / build / docs-build jobs can restore them
  # without repeating the prepare step.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_USE_AI: false
      NUXT_PUBLIC_USE_TAB_B24FRAME: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24jssdk
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bitrix24/b24jssdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Upload prepared workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-workspace
          path: |
            packages/jssdk/dist
            packages/jssdk-nuxt/dist
            packages/jssdk-nuxt/.nuxt
            docs/.nuxt
            playgrounds/nuxt/.nuxt
          include-hidden-files: true
          retention-days: 1

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-workspace

      - name: Lint
        run: pnpm run lint

      - name: Lint guide Markdown (markdownlint)
        run: pnpm run lint:md

  typecheck:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_USE_AI: false
      NUXT_PUBLIC_USE_TAB_B24FRAME: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24jssdk
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bitrix24/b24jssdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-workspace

      - name: Typecheck
        # Includes the four block gates — ```ts fences in docs/content/docs/**,
        # in skills/** and .github/contributing/** (#435), plus the JSDoc @example
        # bodies in packages/jssdk/src/** (#439). All compile against
        # @bitrix24/b24jssdk, so they run after dev:prepare, when dist/ types are
        # available.
        run: pnpm run typecheck

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Test on every supported non-EOL Node line so the runtimes the SDK
    # advertises in `engines` are actually exercised (#174). 22 = the line the
    # publish workflows build the artifact on (lowest supported + validated);
    # 24 = newest active LTS. (Node 20 is still in `engines` but EOL and slated
    # for removal in #312, so it is intentionally not in the matrix.)
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-workspace

      - name: Unit tests (no portal required)
        # Integration and load tests require B24_HOOK — run locally or in a
        # dedicated environment with secrets. See .github/contributing/testing.md.
        run: pnpm run package-jssdk:test:run-unit

      - name: Type-level tests
        # `expectTypeOf` assertions are erased at runtime, so these only mean
        # anything under vitest's typecheck mode — and `test/` is outside every
        # `tsc` pass in the repo. Without this step the pins pass vacuously.
        run: pnpm run package-jssdk:test:run-types

      - name: Run skill-recipe unit tests
        # The recipes under skills/b24jssdk-recipes are shipped as guidance an
        # agent will copy, so their internals get the same treatment as SDK
        # code (#64). Held in their own vitest project because they are the
        # only specs importing the recipes' opt-in packages.
        run: pnpm run skills:test

      - name: Security audit
        # Audit prod + dev dependencies at the `moderate` threshold. Dev deps
        # execute during lint/typecheck/docs builds in CI, so a vulnerable one
        # is in-scope. Known transitive advisories are pinned to patched
        # versions via `overrides` in pnpm-workspace.yaml (#110). Node-agnostic,
        # so run it once (on the baseline leg), not per matrix entry.
        if: matrix.node == 22
        run: pnpm audit --audit-level=moderate

      - name: Security audit (skill recipes)
        # The recipes' dependencies live in their own non-workspace package, so
        # the root audit above cannot reach them (#65). Isolating them from the
        # root manifest was meant to stop them being every contributor's install
        # problem, not to stop anyone watching them — `express` and `openai` are
        # exactly the kind of dependency that needs an audit on it. Same
        # threshold, same one-leg-only rule as the root audit.
        if: matrix.node == 22
        run: pnpm --dir skills/b24jssdk-recipes audit --audit-level=moderate

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-workspace

      - name: Build (jssdk)
        run: pnpm --filter ./packages/jssdk build

      - name: Validate package exports (publint + arethetypeswrong + runtime resolution)
        # Guards the dual ESM/CJS exports contract (#256, #258): publint checks
        # the exports map / files, arethetypeswrong checks types resolve
        # correctly per module system, and the two node one-liners assert the
        # built package actually resolves and exposes B24Hook under both
        # require() (the dist/cjs build) and import — catching a regression in
        # the exports conditions that the type-only tools would miss.
        working-directory: packages/jssdk
        run: |
          npx --yes publint@0.3.21
          npx --yes @arethetypeswrong/cli@0.18.4 --pack .
          node -e "const m = require('@bitrix24/b24jssdk'); if (typeof m.B24Hook !== 'function') { console.error('CJS require did not expose B24Hook'); process.exit(1) } console.log('CJS require OK')"
          node --input-type=module -e "const m = await import('@bitrix24/b24jssdk'); if (typeof m.B24Hook !== 'function') { console.error('ESM import did not expose B24Hook'); process.exit(1) } console.log('ESM import OK')"
          # Guard the #258 contract: the CJS build must keep its deps EXTERNAL
          # (require('axios') etc.), not inline them like the UMD bundle. A flip
          # of inlineDependencies in build.config.ts would silently regress this.
          node -e "const fs=require('fs'); const g=require('child_process').execSync('grep -rl \"require(.axios.)\" dist/cjs',{encoding:'utf8'}).trim(); if(!g){console.error('axios is not externalized in dist/cjs — check inlineDependencies'); process.exit(1)} console.log('CJS deps external OK')"
          # Guard the #332 contract: axios' version lives in the workspace
          # catalog, and `catalog:` is a pnpm protocol that MUST be resolved
          # before the manifest reaches npm. `pnpm pack` resolves it; plain
          # `npm publish` would ship the literal string and break every install.
          # Assert on the packed tarball rather than trusting the publish step to
          # stay `pnpm publish` forever.
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tar -xzOf "$RUNNER_TEMP"/bitrix24-b24jssdk-*.tgz package/package.json > "$RUNNER_TEMP/packed.json"
          node -e "const p=require(process.env.RUNNER_TEMP+'/packed.json'); for (const [name, range] of Object.entries(p.dependencies||{})) { if (String(range).startsWith('catalog:') || String(range).startsWith('workspace:')) { console.error('::error::packed manifest ships an unresolved specifier: '+name+'@'+range); process.exit(1) } } console.log('packed manifest specifiers resolved OK')"

      - name: Build (jssdk-nuxt)
        # Requires packages/jssdk-nuxt/.nuxt/tsconfig.json (from artifact) to resolve
        # tsconfig "extends". jssdk must be built first so @bitrix24/b24jssdk resolves.
        run: pnpm --filter ./packages/jssdk-nuxt build

      - name: Verify jssdk-nuxt version token was replaced (#119)
        # The real build (above, not the dev:prepare stub) must substitute the
        # __SDK_VERSION__ placeholder in meta.version from package.json. Catch a
        # build-config regression here, on every PR — not only at publish time.
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./packages/jssdk-nuxt/package.json').version")
          DIST=packages/jssdk-nuxt/dist/module.mjs
          if grep -q "__SDK_VERSION__" "$DIST"; then
            echo "::error::__SDK_VERSION__ left unreplaced in $DIST — check packages/jssdk-nuxt/build.config.ts"
            exit 1
          fi
          if ! grep -qF "\"$PKG_VER\"" "$DIST"; then
            echo "::error::version \"$PKG_VER\" (from package.json) not found in $DIST — wrong or empty replacement"
            exit 1
          fi
          echo "jssdk-nuxt meta.version = $PKG_VER (token replaced) — OK"

  # Builds the documentation site. On PRs it only validates that the docs
  # generate cleanly (broken builds used to slip through — they only ran in
  # deploy.yml on push to main). On a push / manual dispatch to main it ALSO
  # produces the GitHub Pages artifact, which the `deploy` job below ships — so
  # the site is built once, not twice (was: here + deploy.yml) (#111).
  # Note: prepared-workspace is needed here because Vite (via nuxt generate)
  # crawls workspace packages including jssdk-nuxt/src/runtime/plugin.ts,
  # which resolves tsconfig "extends" from packages/jssdk-nuxt/.nuxt/.
  docs-build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pages: read lets configure-pages derive the base path on a main deploy build.
    permissions:
      contents: read
      pages: read
    env:
      NUXT_PUBLIC_USE_AI: false
      NUXT_PUBLIC_USE_TAB_B24FRAME: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24jssdk
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bitrix24/b24jssdk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared workspace
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-workspace

      # Pages plumbing only on a main deploy build; PRs just validate the build.
      - name: Setup Pages
        if: github.workflow == 'ci' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs
        run: pnpm run docs:generate

      - name: Check the CSP survived the build
        # The browser-based check (scripts/check-docs-csp.mjs) answers "is the
        # policy too strict?" and needs Playwright, so it stays manual. This one
        # answers "is it still there, once, and first in <head>?" — the cheaper
        # failure, and the one an upstream sync or a head-ordering change would
        # otherwise ship silently. See .github/contributing/docs-csp.md.
        run: node scripts/check-docs-csp-present.mjs

      - name: Create Pages artifact
        if: github.workflow == 'ci' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p combined-artifact
          cp -r docs/.output/public/* combined-artifact/
          touch combined-artifact/.nojekyll

      - name: Upload Pages artifact
        if: github.workflow == 'ci' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: combined-artifact

  # Publishes the docs site to GitHub Pages, reusing the artifact built once by
  # docs-build (no second docs:generate). The `github.workflow == 'ci'` guard
  # makes it run only on a direct push / manual dispatch to main — never on PRs,
  # and never when ci.yml is reused via workflow_call by the npm-publish-*.yml
  # release workflows. (#111)
  deploy:
    needs: docs-build
    if: github.workflow == 'ci' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Gate job: satisfies the "ci" required status check in branch protection.
  #
  # Every job is named explicitly and must have the result `success`. Two things
  # this deliberately does NOT do, both of which it used to (#415):
  #
  #   - it does not omit `prepare`. Every other job depends on it, and a job whose
  #     dependency failed is reported `skipped`, not `failure`. With `prepare`
  #     missing from `needs` and only `failure` tested, a broken `prepare` left
  #     lint / typecheck / test / build / docs-build all skipped, no `failure`
  #     anywhere, and this gate green with nothing verified.
  #   - it does not use `contains(needs.*.result, …)`. A wildcard silently accepts
  #     a job that is added to this workflow and forgotten here — the same class
  #     of bug. `scripts/__tests__/ci-gate.test.mjs` fails if a job is missing
  #     from the list below.
  ci:
    needs: [docs-lint, prepare, lint, typecheck, test, build, docs-build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: All checks passed
        shell: bash
        env:
          # `needs['docs-lint']` rather than `needs.docs-lint` — a hyphen is not
          # valid in the property-access form.
          RESULT_DOCS_LINT: ${{ needs['docs-lint'].result }}
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TYPECHECK: ${{ needs.typecheck.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_DOCS_BUILD: ${{ needs['docs-build'].result }}
          RESULT_DEPLOY: ${{ needs.deploy.result }}
        run: |
          failed=0
          for job in DOCS_LINT PREPARE LINT TYPECHECK TEST BUILD DOCS_BUILD; do
            var="RESULT_${job}"
            result="${!var}"
            if [[ "$result" != "success" ]]; then
              echo "::error::job ${job} did not succeed (result: ${result:-missing})"
              failed=1
            fi
          done
          # `deploy` is the one job allowed to be skipped: it is restricted to a
          # push to main, so on every pull request it is legitimately skipped.
          # It must still never fail.
          if [[ "$RESULT_DEPLOY" != "success" && "$RESULT_DEPLOY" != "skipped" ]]; then
            echo "::error::job DEPLOY did not succeed (result: ${RESULT_DEPLOY:-missing})"
            failed=1
          fi
          if [[ "$failed" != "0" ]]; then
            echo "CI gate: one or more jobs did not pass."
            exit 1
          fi
          echo "All CI jobs passed."
